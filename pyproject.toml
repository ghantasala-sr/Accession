[project]
name = "accession"
version = "0.1.0"
description = "Multi-agent RAG for SEC filings. Every answer, traced to its filing."
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.27",
    "lxml>=6.1.3",
    "pyarrow>=26.0.1",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
]

[project.scripts]
accession = "accession.run:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["accession"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# XML fixtures mirror real filings line for line.
"tests/test_instance.py" = ["E501"]
"tests/test_ingest.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["accession"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
